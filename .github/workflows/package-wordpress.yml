name: Package WordPress Storefront

on:
  push:
    branches:
      - feature/wordpress-woocommerce-storefront
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          php -v
          find wordpress -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate release integration
        run: |
          set -euo pipefail
          test -f wordpress/wp-content/plugins/illuminated-path-core/includes/production-site.php
          test -f wordpress/wp-content/plugins/illuminated-path-core/includes/production-content.php
          test -f wordpress/wp-content/plugins/illuminated-path-core/includes/elementor-starter-pages.php
          test -f wordpress/wp-content/plugins/illuminated-path-core/includes/multilingual-integration.php
          test -f wordpress/wp-content/plugins/illuminated-path-core/includes/ecosystem.php
          test -f wordpress/wp-content/plugins/illuminated-path-core/includes/content-pack.php
          test -f wordpress/wp-content/plugins/illuminated-path-core/data/final-content-pack.json
          test -f wordpress/wp-content/themes/illuminated-path/assets/css/content-pack.css
          test -f wordpress/wp-content/themes/illuminated-path/assets/css/account.css
          grep -q "Version: 0.8.0" wordpress/wp-content/plugins/illuminated-path-core/illuminated-path-core.php
          grep -q "IP_CORE_VERSION', '0.8.0" wordpress/wp-content/plugins/illuminated-path-core/illuminated-path-core.php
          grep -q "Version: 0.8.0" wordpress/wp-content/themes/illuminated-path/style.css
          grep -q "IP_THEME_VERSION', '0.8.0" wordpress/wp-content/themes/illuminated-path/functions.php
          test "$(grep -c "require_once IP_CORE_DIR . 'includes/elementor-starter-pages.php';" wordpress/wp-content/plugins/illuminated-path-core/illuminated-path-core.php)" -eq 1
          grep -q "includes/production-content.php" wordpress/wp-content/plugins/illuminated-path-core/illuminated-path-core.php
          grep -q "includes/production-site.php" wordpress/wp-content/plugins/illuminated-path-core/illuminated-path-core.php
          grep -q "includes/ecosystem.php" wordpress/wp-content/plugins/illuminated-path-core/illuminated-path-core.php
          python -m json.tool wordpress/wp-content/themes/illuminated-path/theme.json >/dev/null
          python -m json.tool wordpress/wp-content/plugins/illuminated-path-core/data/final-content-pack.json >/dev/null
          grep -q '"es"' wordpress/wp-content/plugins/illuminated-path-core/data/final-content-pack.json
          grep -q '"ar"' wordpress/wp-content/plugins/illuminated-path-core/data/final-content-pack.json
          find wordpress -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Build ZIP packages
        run: |
          mkdir -p dist/full-package
          cp -R wordpress dist/full-package/wordpress
          (cd dist/full-package && zip -r ../little-muslim-books-wordpress-full.zip wordpress)
          (cd wordpress/wp-content/themes && zip -r ../../../dist/illuminated-path-theme.zip illuminated-path)
          (cd wordpress/wp-content/plugins && zip -r ../../../dist/illuminated-path-core-plugin.zip illuminated-path-core)
          unzip -t dist/little-muslim-books-wordpress-full.zip
          unzip -t dist/illuminated-path-theme.zip
          unzip -t dist/illuminated-path-core-plugin.zip

      - name: Upload full package
        uses: actions/upload-artifact@v4
        with:
          name: little-muslim-books-wordpress-full
          path: dist/little-muslim-books-wordpress-full.zip
          if-no-files-found: error

      - name: Upload installable theme
        uses: actions/upload-artifact@v4
        with:
          name: illuminated-path-theme
          path: dist/illuminated-path-theme.zip
          if-no-files-found: error

      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: illuminated-path-core-plugin
          path: dist/illuminated-path-core-plugin.zip
          if-no-files-found: error
